name: CLOUD GAMER PC
run-name: Configurando PC Gamer na Nuvem

on: [push, workflow_dispatch]

jobs:
  configurar:
    runs-on: windows-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Executar instalador
        shell: powershell
        run: |
          .\Instalador-CloudPC.ps1
          
